<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>ลงทะเบียน - Line Flex Message Builder</title>
    <link rel="stylesheet" href="/css/style.css">
    <style>
        .register-line-container {
            max-width: 500px;
            margin: 30px auto;
        }
        .info-banner {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            text-align: center;
        }
        .info-banner p {
            margin: 0;
            font-size: 0.95rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card register-line-container">
            <div class="card-header">
                <h1>ลงทะเบียน</h1>
                <p>กรุณากรอกข้อมูลเพื่อสร้างการ์ดของคุณ</p>
            </div>

            <div class="info-banner">
                <p>✅ คุณได้เข้าสู่ระบบด้วย LINE แล้ว</p>
                <p style="font-size: 0.85rem; margin-top: 5px;">กรุณากรอกข้อมูลเพิ่มเติมเพื่อเริ่มใช้งาน</p>
            </div>

            <div class="alert alert-error" id="errorAlert"></div>
            <div class="alert alert-success" id="successAlert"></div>

            <form id="registerForm">
                <div class="form-group">
                    <label for="firstName">ชื่อ *</label>
                    <input type="text" id="firstName" name="firstName" required placeholder="กรอกชื่อ">
                </div>

                <div class="form-group">
                    <label for="lastName">นามสกุล *</label>
                    <input type="text" id="lastName" name="lastName" required placeholder="กรอกนามสกุล">
                </div>

                <div class="form-group">
                    <label for="nickname">ชื่อเล่น</label>
                    <input type="text" id="nickname" name="nickname" placeholder="กรอกชื่อเล่น (ไม่บังคับ)">
                </div>

                <div class="form-group">
                    <label for="phone">เบอร์โทรศัพท์ *</label>
                    <input type="tel" id="phone" name="phone" required placeholder="0812345678" maxlength="10" inputmode="numeric" pattern="[0-9]*" title="ไม่เกิน 10 หลัก">
                    <small class="form-hint">ไม่เกิน 10 หลัก</small>
                </div>

                <div class="form-group">
                    <label for="email">อีเมล *</label>
                    <input type="email" id="email" name="email" required placeholder="example@email.com">
                </div>

                <button type="submit" class="btn btn-primary btn-block" id="submitBtn">
                    สมัครสมาชิก
                </button>
            </form>

            <div class="text-center mt-20">
                <p style="color: var(--text-light); font-size: 0.9rem;">
                    ข้อมูลนี้จะถูกใช้เป็นข้อมูลตั้งต้นในการสร้างการ์ด<br>
                    คุณสามารถแก้ไขได้ภายหลัง
                </p>
            </div>
        </div>
    </div>

    <script>
        const form = document.getElementById('registerForm');
        const errorAlert = document.getElementById('errorAlert');
        const successAlert = document.getElementById('successAlert');
        const submitBtn = document.getElementById('submitBtn');

        // ดึง token และ line_user_id จาก URL
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');
        const lineUserId = urlParams.get('line_user_id');

        // ตรวจสอบว่ามี token หรือไม่
        if (!token) {
            showAlert(errorAlert, 'ไม่พบ token กรุณาเข้าสู่ระบบใหม่', 'error');
            setTimeout(() => {
                window.location.href = '/';
            }, 3000);
        }

        function showAlert(alertElement, message, type = 'error') {
            alertElement.textContent = message;
            alertElement.className = `alert alert-${type} show`;
            setTimeout(() => {
                alertElement.classList.remove('show');
            }, 5000);
        }

        // เบอร์โทร: รับเฉพาะตัวเลข ไม่เกิน 10 หลัก
        const phoneInputReg = document.getElementById('phone');
        if (phoneInputReg) {
            phoneInputReg.addEventListener('input', function () {
                this.value = this.value.replace(/\D/g, '').slice(0, 10);
            });
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const phoneVal = document.getElementById('phone').value.trim();
            if (phoneVal.length > 10) {
                showAlert(errorAlert, 'เบอร์โทรศัพท์ไม่เกิน 10 หลัก', 'error');
                return;
            }
            submitBtn.disabled = true;
            submitBtn.textContent = 'กำลังบันทึก...';

            try {
                const formData = {
                    first_name: document.getElementById('firstName').value.trim(),
                    last_name: document.getElementById('lastName').value.trim(),
                    nickname: document.getElementById('nickname').value.trim() || null,
                    phone: document.getElementById('phone').value.trim(),
                    email: document.getElementById('email').value.trim()
                };

                const response = await fetch('/api/auth/line/complete-profile', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify(formData)
                });

                const data = await response.json();

                if (data.success) {
                    showAlert(successAlert, data.message, 'success');
                    
                    // บันทึก token และ user data
                    localStorage.setItem('token', token);
                    localStorage.setItem('user', JSON.stringify(data.user));
                    
                    // Redirect ไปหน้าสร้างการ์ด
                    setTimeout(() => {
                        window.location.href = '/create';
                    }, 1500);
                } else {
                    showAlert(errorAlert, data.message);
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'สมัครสมาชิก';
                }
            } catch (error) {
                console.error('Error:', error);
                showAlert(errorAlert, 'เกิดข้อผิดพลาดในการเชื่อมต่อ');
                submitBtn.disabled = false;
                submitBtn.textContent = 'สมัครสมาชิก';
            }
        });
    </script>
</body>
</html>
