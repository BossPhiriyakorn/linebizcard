<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>แก้ไขการ์ด - Line Flex Message Builder</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h2>แก้ไขการ์ด</h2>
            <div class="user-info">
                <span id="username"></span>
                <a href="/my-cards" class="btn btn-secondary btn-sm">ดูการ์ดทั้งหมด</a>
            </div>
        </div>

        <div class="card">
            <div class="alert alert-error" id="errorAlert"></div>
            <div class="alert alert-success" id="successAlert"></div>

            <div id="loadingState" class="text-center">
                <div class="loading"></div>
                <p>กำลังโหลดข้อมูลการ์ด...</p>
            </div>

            <div id="editFormSection" style="display: none;">
                <h2 style="margin-bottom: 20px;">แก้ไขข้อมูลการ์ด</h2>
                <div class="form-preview-container">
                    <div class="form-section">
                        <form id="editCardForm">
                            <div class="card-section">
                                <div class="form-group">
                                    <label for="name">ชื่อ *</label>
                                    <input type="text" id="name" name="name" required placeholder="กรอกชื่อ-นามสกุล">
                                </div>
                                <div class="form-group">
                                    <label for="phone">Tel.</label>
                                    <input type="tel" id="phone" name="phone" placeholder="เบอร์โทรศัพท์" maxlength="10" inputmode="numeric" pattern="[0-9]*" title="ไม่เกิน 10 หลัก">
                                    <small class="form-hint">ไม่เกิน 10 หลัก</small>
                                </div>
                                <div class="form-group">
                                    <label for="email">Email</label>
                                    <input type="email" id="email" name="email" placeholder="อีเมล">
                                </div>
                                <div class="form-group">
                                    <label for="description">รายละเอียด</label>
                                    <textarea id="description" name="description" rows="3" placeholder="กรอกรายละเอียด..."></textarea>
                                </div>
                            </div>
                            <div class="card-section">
                                <div class="form-group">
                                    <label for="image1">รูปภาพ</label>
                                    <input type="file" id="image1" name="image1" accept="image/*">
                                    <small class="form-hint">เว้นว่างไว้ถ้าไม่เปลี่ยนรูป</small>
                                    <div class="image-preview" id="imagePreview1" style="display: none;">
                                        <img id="previewImg1" src="" alt="Preview">
                                        <div class="file-info" id="fileInfo1"></div>
                                    </div>
                                </div>
                            </div>
                            <div style="display: flex; gap: 10px;">
                                <a href="/my-cards" class="btn btn-secondary">ย้อนกลับ</a>
                                <button type="submit" class="btn btn-primary" id="saveBtn" style="flex: 1;">บันทึกการแก้ไข</button>
                            </div>
                        </form>
                    </div>
                    <div class="preview-section">
                        <h3 style="margin-bottom: 15px; color: var(--text-color);">📱 ตัวอย่างการ์ด</h3>
                        <div class="single-preview-container">
                            <div class="flex-preview-card preview-card-1" id="previewCard1">
                                <div class="preview-hero" id="previewHero1">
                                    <img id="previewHeroImg1" src="" alt="Preview" style="display: none;">
                                    <div class="preview-placeholder" id="previewPlaceholder1">
                                        <span>📷</span>
                                        <p>อัพโหลดรูปภาพ</p>
                                    </div>
                                </div>
                                <div class="preview-body">
                                    <div class="preview-name" id="previewName1">name</div>
                                    <div class="preview-separator"></div>
                                    <div class="preview-field">
                                        <div class="preview-field-label">Tel.</div>
                                        <div class="preview-field-value" id="previewPhone1"></div>
                                    </div>
                                    <div class="preview-field">
                                        <div class="preview-field-label">Email</div>
                                        <div class="preview-field-value" id="previewEmail1"></div>
                                    </div>
                                    <div class="preview-separator"></div>
                                    <div class="preview-field-value" id="previewDescription1" style="margin-top: 10px;">description</div>
                                </div>
                                <div class="preview-footer">
                                    <div class="preview-footer-row">
                                        <button type="button" class="preview-btn preview-btn-primary">โทร</button>
                                        <button type="button" class="preview-btn preview-btn-secondary">ส่งอีเมล</button>
                                    </div>
                                    <div class="preview-footer-row preview-footer-row-share">
                                        <button type="button" class="preview-btn preview-btn-share">แชร์</button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const token = localStorage.getItem('token');
        if (!token) {
            window.location.href = '/';
        }

        const user = JSON.parse(localStorage.getItem('user') || '{}');
        document.getElementById('username').textContent = getDisplayName(user);

        function getDisplayName(p) {
            if (!p) return 'ผู้ใช้';
            const full = `${p.first_name || ''} ${p.last_name || ''}`.trim();
            return full || p.nickname || p.username || 'ผู้ใช้';
        }

        async function loadUserProfile() {
            try {
                const res = await fetch('/api/user/profile', { headers: { 'Authorization': 'Bearer ' + token } });
                const data = await res.json();
                if (data.success && data.data) {
                    const profile = data.data;
                    const el = document.getElementById('username');
                    if (el) el.textContent = getDisplayName(profile);
                    localStorage.setItem('user', JSON.stringify({ ...user, ...profile }));
                }
            } catch (e) { console.error('Load profile:', e); }
        }

        function getCardId() {
            const m = window.location.pathname.match(/\/edit-card\/(\d+)/);
            return m ? m[1] : null;
        }

        function showAlert(alertId, message, type) {
            const alert = document.getElementById(alertId);
            alert.textContent = message;
            alert.className = 'alert alert-' + (type || 'error') + ' show';
            setTimeout(function () { alert.classList.remove('show'); }, 5000);
        }

        function updatePreview() {
            const name = document.getElementById('name').value.trim() || 'name';
            const phone = document.getElementById('phone').value.trim() || '';
            const email = document.getElementById('email').value.trim() || '';
            const desc = document.getElementById('description').value.trim() || 'description';
            document.getElementById('previewName1').textContent = name;
            document.getElementById('previewPhone1').textContent = phone;
            document.getElementById('previewEmail1').textContent = email;
            document.getElementById('previewDescription1').textContent = desc;
        }

        async function loadCard() {
            const cardId = getCardId();
            if (!cardId) {
                showAlert('errorAlert', 'ไม่พบรหัสการ์ด');
                document.getElementById('loadingState').innerHTML = '<p class="alert alert-error">ไม่พบรหัสการ์ด <a href="/my-cards">กลับไปรายการการ์ด</a></p>';
                return;
            }

            try {
                const res = await fetch('/api/cards/' + cardId, {
                    headers: { 'Authorization': 'Bearer ' + token }
                });
                const data = await res.json();

                if (res.status === 401) {
                    localStorage.removeItem('token');
                    localStorage.removeItem('user');
                    window.location.href = '/';
                    return;
                }
                if (!res.ok || !data.success) {
                    showAlert('errorAlert', data.message || 'โหลดการ์ดไม่สำเร็จ');
                    document.getElementById('loadingState').innerHTML = '<p class="alert alert-error">' + (data.message || 'โหลดไม่สำเร็จ') + ' <a href="/my-cards">กลับไปรายการการ์ด</a></p>';
                    return;
                }

                const card = data.data;
                document.getElementById('name').value = card.user_name || '';
                document.getElementById('phone').value = card.user_phone || '';
                document.getElementById('email').value = card.user_email || '';
                document.getElementById('description').value = card.user_description || '';

                if (card.user_image) {
                    document.getElementById('previewHeroImg1').src = card.user_image;
                    document.getElementById('previewHeroImg1').style.display = 'block';
                    document.getElementById('previewPlaceholder1').style.display = 'none';
                }

                document.getElementById('loadingState').style.display = 'none';
                document.getElementById('editFormSection').style.display = 'block';
                updatePreview();
            } catch (err) {
                console.error(err);
                showAlert('errorAlert', 'เกิดข้อผิดพลาดในการโหลด');
                document.getElementById('loadingState').innerHTML = '<p class="alert alert-error">เกิดข้อผิดพลาด <a href="/my-cards">กลับไปรายการการ์ด</a></p>';
            }
        }

        document.getElementById('editCardForm').addEventListener('submit', async function (e) {
            e.preventDefault();
            const cardId = getCardId();
            if (!cardId) {
                showAlert('errorAlert', 'ไม่พบรหัสการ์ด');
                return;
            }
            const phoneVal = document.getElementById('phone').value.trim();
            if (phoneVal.length > 10) {
                showAlert('errorAlert', 'เบอร์โทรศัพท์ไม่เกิน 10 หลัก');
                return;
            }

            const formData = new FormData();
            formData.append('name', document.getElementById('name').value.trim());
            formData.append('phone', document.getElementById('phone').value.trim());
            formData.append('email', document.getElementById('email').value.trim());
            formData.append('description', document.getElementById('description').value.trim());
            const image1File = document.getElementById('image1').files[0];
            if (image1File) formData.append('image1', image1File);

            const saveBtn = document.getElementById('saveBtn');
            saveBtn.disabled = true;
            saveBtn.textContent = 'กำลังบันทึก...';

            try {
                const res = await fetch('/api/cards/' + cardId, {
                    method: 'PUT',
                    headers: { 'Authorization': 'Bearer ' + token },
                    body: formData
                });
                const data = await res.json();

                if (res.ok && data.success) {
                    showAlert('successAlert', 'แก้ไขการ์ดสำเร็จ', 'success');
                    setTimeout(function () { window.location.href = '/my-cards?updated=1'; }, 1000);
                } else {
                    showAlert('errorAlert', data.message || 'แก้ไขไม่สำเร็จ');
                    saveBtn.disabled = false;
                    saveBtn.textContent = 'บันทึกการแก้ไข';
                }
            } catch (err) {
                console.error(err);
                showAlert('errorAlert', 'เกิดข้อผิดพลาดในการบันทึก');
                saveBtn.disabled = false;
                saveBtn.textContent = 'บันทึกการแก้ไข';
            }
        });

        document.getElementById('name').addEventListener('input', updatePreview);
        document.getElementById('phone').addEventListener('input', updatePreview);
        document.getElementById('email').addEventListener('input', updatePreview);
        document.getElementById('description').addEventListener('input', updatePreview);

        // เบอร์โทร: รับเฉพาะตัวเลข ไม่เกิน 10 หลัก
        const phoneInputEdit = document.getElementById('phone');
        if (phoneInputEdit) {
            phoneInputEdit.addEventListener('input', function () {
                this.value = this.value.replace(/\D/g, '').slice(0, 10);
            });
        }

        document.getElementById('image1').addEventListener('change', function (e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function (ev) {
                    const url = ev.target.result;
                    document.getElementById('previewImg1').src = url;
                    document.getElementById('fileInfo1').textContent = file.name + ' (' + (file.size / 1024).toFixed(2) + ' KB)';
                    document.getElementById('imagePreview1').style.display = 'block';
                    document.getElementById('previewHeroImg1').src = url;
                    document.getElementById('previewHeroImg1').style.display = 'block';
                    document.getElementById('previewPlaceholder1').style.display = 'none';
                };
                reader.readAsDataURL(file);
            }
        });

        loadUserProfile();
        loadCard();
    </script>
</body>
</html>
