<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>แชร์ Flex Message - Line Flex Message Builder</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: max(20px, env(safe-area-inset-top)) max(20px, env(safe-area-inset-right)) max(20px, env(safe-area-inset-bottom)) max(20px, env(safe-area-inset-left));
        }
        .container {
            background: white;
            padding: clamp(20px, 5vw, 40px);
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
            text-align: center;
            max-width: min(500px, 100%);
            width: 100%;
            box-sizing: border-box;
        }
        .loading {
            display: inline-block;
            width: 40px;
            height: 40px;
            border: 4px solid rgba(29, 180, 70, 0.3);
            border-radius: 50%;
            border-top-color: #1DB446;
            animation: spin 1s ease-in-out infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .error {
            color: #e74c3c;
            background: #f8d7da;
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
        }
        .success {
            color: #27ae60;
            background: #d4edda;
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div id="loading">
            <div class="loading"></div>
            <p style="margin-top: 20px;">Loading...</p>
        </div>
        <div id="error" style="display: none;"></div>
        <div id="success" style="display: none;"></div>
    </div>

    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <script>
        // ดึง LIFF_ID จาก server (ดึงจาก .env ผ่าน API)
        let LIFF_ID = '';

        async function fetchLiffId() {
            try {
                const response = await fetch('/api/liff-id');
                if (!response.ok) {
                    throw new Error('ไม่สามารถดึง LIFF ID ได้');
                }
                const data = await response.json();
                if (data.success && data.liff_id) {
                    LIFF_ID = data.liff_id;
                } else {
                    throw new Error('ไม่พบ LIFF ID ใน response');
                }
            } catch (error) {
                console.error('Error fetching LIFF ID:', error);
                showError('ไม่สามารถดึง LIFF ID ได้ กรุณาตรวจสอบการตั้งค่า');
                throw error; // Throw เพื่อให้ caller รู้ว่าเกิด error
            }
        }

        async function fetchJson(name) {
            const response = await fetch(`/json/${name}.json`);
            if (!response.ok) {
                throw new Error('ไม่พบไฟล์ JSON');
            }
            return await response.json();
        }

        async function sendShare(name, id) {
            try {
                // โหลด JSON
                const flexContent = await fetchJson(name);
                
                // แปลง id เป็น integer (default: 1)
                const flexIndex = parseInt(id) || 1;
                
                // ตรวจสอบ structure
                if (!flexContent.tectony1 || !flexContent.tectony1[0] || !flexContent.tectony1[flexIndex]) {
                    throw new Error('รูปแบบ JSON ไม่ถูกต้อง');
                }
                
                // สร้าง Flex Message object
                const flexMessage = {
                    "type": "flex",
                    "altText": flexContent.tectony1[0]['linemsg'] || 'Flex Message',
                    "contents": flexContent.tectony1[flexIndex]
                };
                
                // ส่งผ่าน LIFF
                const result = await liff.shareTargetPicker([flexMessage]);
                
                if (result) {
                    showSuccess('แชร์ Flex Message สำเร็จแล้ว!');
                    setTimeout(() => {
                        liff.closeWindow();
                    }, 2000);
                } else {
                    // ผู้ใช้ยกเลิก
                    showError('ยกเลิกการแชร์');
                    setTimeout(() => {
                        liff.closeWindow();
                    }, 2000);
                }
            } catch (error) {
                console.error('Error:', error);
                let msg = error.message || 'เกิดข้อผิดพลาด';
                if (msg.includes('shareTargetPicker is not allowed')) {
                    const pageUrl = window.location.origin + (window.location.pathname || '/');
                    msg = 'shareTargetPicker ยังไม่เปิดสำหรับ LIFF app นี้ — ใน LINE Developers ตั้ง Endpoint URL ของ LIFF app นี้ให้ตรงกับ URL หน้านี้ทุกตัวอักษร (รวม / ท้ายหรือไม่): ' + pageUrl;
                }
                showError('เกิดข้อผิดพลาด: ' + msg);
                setTimeout(() => {
                    if (typeof liff !== 'undefined' && liff.closeWindow) liff.closeWindow();
                }, 3000);
            }
        }

        async function main() {
            try {
                // ดึง parameters จาก URL ก่อน (เก็บไว้ก่อน login)
                const params = new URLSearchParams(window.location.search);
                const name = params.get('name');
                const id = params.get('id') || '1';
                const token = params.get('token'); // Token จาก callback (ถ้ามี)
                
                // ถ้าไม่มี name ใน URL แต่มีใน localStorage (จากครั้งก่อน) ให้ใช้ค่านั้น
                const savedName = localStorage.getItem('share_card_name');
                const savedId = localStorage.getItem('share_card_id');
                
                const cardName = name || savedName;
                const cardId = id || savedId || '1';
                
                // เก็บ parameters ไว้ใน localStorage (กรณีที่ login แล้ว redirect กลับมา)
                // ⚠️ สำคัญ: เก็บก่อน init LIFF เพื่อให้มีข้อมูลเมื่อ redirect กลับมา
                if (name) {
                    localStorage.setItem('share_card_name', name);
                    console.log('Saved card name to localStorage:', name);
                }
                if (id) {
                    localStorage.setItem('share_card_id', id);
                    console.log('Saved card id to localStorage:', id);
                }
                
                // ถ้ามี token จาก callback → เก็บไว้ใน localStorage เพื่อใช้ใน API calls
                if (token) {
                    localStorage.setItem('auth_token', token);
                    console.log('Saved token to localStorage');
                    
                    // ⚠️ สำคัญ: ถ้ามี token แต่ไม่มี name ใน URL → ใช้ name จาก localStorage
                    // กรณีนี้เกิดขึ้นเมื่อ liff.login() redirect กลับมาที่ BASE_URL (ไม่มี query parameters)
                    if (!name && savedName) {
                        console.log('Token found but no name in URL, using saved card name from localStorage:', savedName);
                        console.log('Redirecting to URL with query parameters...');
                        // Redirect กลับไปที่ URL เดิมพร้อม query parameters
                        const newUrl = new URL(window.location.href);
                        newUrl.searchParams.set('name', savedName);
                        if (savedId) {
                            newUrl.searchParams.set('id', savedId);
                        }
                        // เก็บ token ไว้ใน URL ด้วย
                        newUrl.searchParams.set('token', token);
                        window.location.replace(newUrl.toString());
                        return;
                    }
                }
                
                // ดึง LIFF_ID จาก server (ต้องดึงก่อน init LIFF)
                await fetchLiffId();

                if (!LIFF_ID) {
                    throw new Error('ไม่พบ LIFF ID');
                }

                // Initialize LIFF
                console.log('Initializing LIFF with ID:', LIFF_ID);
                console.log('Current URL:', window.location.href);
                console.log('Current pathname:', window.location.pathname);
                console.log('Has token:', !!token);
                
                await liff.init({ liffId: LIFF_ID });
                
                // ตรวจสอบ context (log เท่านั้น — ไม่ block เมื่อเปิดจาก Chrome)
                const isInClient = liff.isInClient();
                const isShareAvailable = liff.isApiAvailable('shareTargetPicker');
                console.log('isInClient:', isInClient, 'shareTargetPicker available:', isShareAvailable);
                console.log('LIFF context:', {
                    isLoggedIn: liff.isLoggedIn(),
                    isInClient: isInClient,
                    getOS: liff.getOS(),
                    getVersion: liff.getVersion(),
                    getContext: liff.getContext ? liff.getContext() : 'N/A'
                });
                // เมื่อเปิดจาก Chrome: LIFF SDK จะเปิด pop-up ไป access.line.me/.../liff/shareTargetPicker ให้เลือกแชร์ได้ (เหมือน linecard.tectony.co.th)
                // จึงไม่ block ที่นี่ — ให้ลองเรียก sendShare() ต่อไป

                // ตรวจสอบ login
                if (!liff.isLoggedIn()) {
                    // ⚠️ ใช้แบบโปรเจกต์ที่ทำงานได้ (Line_Flex_UPdate): ไม่ส่ง redirectUri
                    // เมื่อไม่ส่ง redirectUri → LIFF จะ redirect กลับมาที่ URL ปัจจุบัน (รวม query string name, id)
                    // ดู docs/ANALYSIS_LINEFLEXVIP_PROJECT.md
                    if (cardName) {
                        localStorage.setItem('share_card_name', cardName);
                        console.log('Saved card name to localStorage before login:', cardName);
                    }
                    if (cardId) {
                        localStorage.setItem('share_card_id', cardId);
                        console.log('Saved card id to localStorage before login:', cardId);
                    }
                    console.log('LIFF login (no redirectUri) - Current URL:', window.location.href);
                    liff.login();  // ไม่ส่ง redirectUri → กลับมาที่ URL เดิมพร้อม query params
                    return;
                }
                
                // ถ้า login แล้ว แต่ไม่มี name ใน URL และ localStorage = เปิดโดเมนเพื่อ "เข้าแอป" ไม่ใช่แชร์การ์ด → พาไป LINE Login (โดเมน)
                if (!cardName) {
                    const baseUrl = window.location.origin;
                    window.location.href = baseUrl + '/api/auth/line/login';
                    return;
                }
                
                // ลบข้อมูลจาก localStorage หลังจากใช้แล้ว (แต่เก็บ token ไว้)
                localStorage.removeItem('share_card_name');
                localStorage.removeItem('share_card_id');
                
                // ส่ง Flex Message
                await sendShare(cardName, cardId);
            } catch (error) {
                console.error('Error:', error);
                showError('เกิดข้อผิดพลาด: ' + error.message);
            }
        }

        function showError(message) {
            document.getElementById('loading').style.display = 'none';
            const errorDiv = document.getElementById('error');
            errorDiv.style.display = 'block';
            errorDiv.className = 'error';
            errorDiv.textContent = message;
        }

        function showSuccess(message) {
            document.getElementById('loading').style.display = 'none';
            const successDiv = document.getElementById('success');
            successDiv.style.display = 'block';
            successDiv.className = 'success';
            successDiv.textContent = message;
        }

        // Auto run เมื่อโหลดหน้า
        document.addEventListener("DOMContentLoaded", async () => {
            await main();
        });
    </script>
</body>
</html>
