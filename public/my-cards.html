<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>การ์ดของฉัน - Line Flex Message Builder</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <h2>การ์ดของฉัน</h2>
            <div class="user-info">
                <span id="username"></span>
                <a href="/create" class="btn btn-primary btn-sm">สร้างการ์ดใหม่</a>
            </div>
        </div>

        <div id="successBanner" class="alert alert-success" style="display: none; margin-bottom: 20px;"></div>

        <!-- Search Box -->
        <div class="card">
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="ค้นหาการ์ด (ชื่อ, เบอร์โทร, อีเมล)">
            </div>
        </div>

        <!-- Cards List -->
        <div id="cardsContainer">
            <div class="card">
                <div class="text-center">
                    <div class="loading"></div>
                    <p>กำลังโหลดข้อมูล...</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        let allCards = [];

        // อ่าน token จาก URL ก่อน (หลัง LINE callback จะ redirect มาพร้อม ?token=xxx)
        const urlParams = new URLSearchParams(window.location.search);
        const urlToken = urlParams.get('token');
        if (urlToken) {
            localStorage.setItem('token', urlToken);
            urlParams.delete('token');
            const cleanSearch = urlParams.toString();
            const cleanUrl = window.location.pathname + (cleanSearch ? '?' + cleanSearch : '');
            window.history.replaceState({}, document.title, cleanUrl);
        }

        // ตรวจสอบ authentication
        const token = localStorage.getItem('token');
        if (!token) {
            console.warn('No token found, redirecting to home');
            window.location.href = '/';
            // ไม่ต้อง return เพราะ browser จะ redirect ไปอยู่แล้ว
        } else {

        console.log('Token found, loading cards...');

        // แสดงชื่อจาก localStorage ชั่วคราว (จะอัปเดตจาก API ใน loadUserProfile)
        const user = JSON.parse(localStorage.getItem('user') || '{}');
        document.getElementById('username').textContent = getDisplayName(user);

        function getDisplayName(p) {
            if (!p) return 'ผู้ใช้';
            const full = `${p.first_name || ''} ${p.last_name || ''}`.trim();
            return full || p.nickname || p.username || 'ผู้ใช้';
        }

        async function loadUserProfile() {
            try {
                const res = await fetch('/api/user/profile', { headers: { 'Authorization': 'Bearer ' + token } });
                const data = await res.json();
                if (data.success && data.data) {
                    const profile = data.data;
                    const el = document.getElementById('username');
                    if (el) el.textContent = getDisplayName(profile);
                    localStorage.setItem('user', JSON.stringify({ ...user, ...profile }));
                }
            } catch (e) { console.error('Load profile:', e); }
        }

        // ถ้ามาจากหน้าสร้างการ์ดสำเร็จ (?created=1) หรือแก้ไขสำเร็จ (?updated=1) แสดงข้อความ
        const urlCreated = urlParams.get('created') === '1';
        const urlUpdated = urlParams.get('updated') === '1';
        if (urlCreated || urlUpdated) {
            const banner = document.getElementById('successBanner');
            banner.textContent = urlUpdated ? '✅ แก้ไขการ์ดสำเร็จ!' : '✅ สร้างการ์ดสำเร็จ! คัดลอกลิงค์ด้านล่างเพื่อนำไปใช้งานใน LINE';
            banner.style.display = 'block';
            setTimeout(function () {
                banner.style.display = 'none';
            }, 5000);
            history.replaceState({}, document.title, window.location.pathname);
        }

        // Load cards
        async function loadCards() {
            try {
                if (!token) {
                    console.error('No token found');
                    showError('ไม่พบ token กรุณาเข้าสู่ระบบใหม่');
                    return;
                }

                console.log('Loading cards...');
                const response = await fetch('/api/my-cards', {
                    method: 'GET',
                    headers: {
                        'Authorization': `Bearer ${token}`
                    },
                    cache: 'no-store'
                });

                console.log('Response status:', response.status);

                if (response.status === 401) {
                    localStorage.removeItem('token');
                    localStorage.removeItem('user');
                    window.location.href = '/';
                    return;
                }

                const data = await response.json();
                console.log('Response data:', data);

                if (data.success) {
                    allCards = Array.isArray(data.data) ? data.data : [];
                    console.log('Cards loaded:', allCards.length);
                    displayCards(allCards);
                } else {
                    console.error('API error:', data.message);
                    showError(data.message || 'ไม่สามารถโหลดข้อมูลได้');
                }
            } catch (error) {
                console.error('Error loading cards:', error);
                showError('เกิดข้อผิดพลาดในการเชื่อมต่อ');
            }
        }

        function displayCards(cards) {
            const container = document.getElementById('cardsContainer');
            
            if (cards.length === 0) {
                container.innerHTML = `
                    <div class="card">
                        <div class="empty-state">
                            <h3>ยังไม่มีการ์ด</h3>
                            <p>เริ่มสร้างการ์ดแรกของคุณเลย!</p>
                            <a href="/create" class="btn btn-primary mt-20">สร้างการ์ดใหม่</a>
                        </div>
                    </div>
                `;
                return;
            }

            container.innerHTML = '<div class="cards-list"></div>';
            const list = container.querySelector('.cards-list');

            cards.forEach(card => {
                const cardElement = document.createElement('div');
                cardElement.className = 'card-item';
                
                const createdDate = new Date(card.created_at).toLocaleDateString('th-TH', {
                    year: 'numeric',
                    month: 'long',
                    day: 'numeric',
                    hour: '2-digit',
                    minute: '2-digit'
                });

                cardElement.innerHTML = `
                    <div class="card-item-header">
                        <div>
                            <h3>${card.user_name || 'ไม่ระบุชื่อ'}</h3>
                            <span class="badge">${card.template_name || 'Template'}</span>
                        </div>
                    </div>
                    ${card.user_image ? `<img src="${card.user_image}" alt="Card Image" class="card-item-image">` : ''}
                    <div class="card-item-info">
                        ${card.user_phone ? `<p>📞 ${card.user_phone}</p>` : ''}
                        ${card.user_email ? `<p>✉️ ${card.user_email}</p>` : ''}
                        <p style="color: #999; font-size: 0.8rem;">สร้างเมื่อ: ${createdDate}</p>
                        ${card.updated_at ? `<p style="color: #999; font-size: 0.8rem;">แก้ไขล่าสุด: ${new Date(card.updated_at).toLocaleDateString('th-TH', { year: 'numeric', month: 'long', day: 'numeric', hour: '2-digit', minute: '2-digit' })}</p>` : ''}
                    </div>
                    <div class="link-display" style="margin: 15px 0;">
                        <input type="text" value="${card.liff_url}" readonly>
                    </div>
                    <div class="card-item-actions">
                        <a href="/edit-card/${card.id}" class="btn btn-primary btn-sm">แก้ไข</a>
                        <button class="btn btn-secondary btn-sm" onclick="copyLink('${card.liff_url}')">คัดลอกลิงค์</button>
                        <button class="btn btn-secondary btn-sm" onclick="shareLink(this)" data-share-url="${(card.liff_url || '').replace(/&/g, '&amp;').replace(/"/g, '&quot;')}" title="แชร์ใน LINE">แชร์ใน LINE</button>
                        <button class="btn btn-danger btn-sm" onclick="deleteCard(${card.id})">ลบ</button>
                    </div>
                `;
                list.appendChild(cardElement);
            });
        }

        // Search functionality
        document.getElementById('searchInput').addEventListener('input', function(e) {
            const searchTerm = e.target.value.toLowerCase();
            const filtered = allCards.filter(card => {
                return (
                    (card.user_name && card.user_name.toLowerCase().includes(searchTerm)) ||
                    (card.user_phone && card.user_phone.includes(searchTerm)) ||
                    (card.user_email && card.user_email.toLowerCase().includes(searchTerm))
                );
            });
            displayCards(filtered);
        });

        function copyLink(url) {
            const input = document.createElement('input');
            input.value = url;
            document.body.appendChild(input);
            input.select();
            document.execCommand('copy');
            document.body.removeChild(input);
            alert('คัดลอกลิงค์แล้ว!');
        }

        // แชร์การ์ดใน LINE: เปิดลิงค์ LIFF ของการ์ด → หน้า share จะแสดงรายการ "แชร์กับ" (กลุ่ม/เพื่อน/แชท) ใน LINE
        function shareLink(btn) {
            const url = btn.getAttribute('data-share-url') || '';
            if (!url) {
                alert('ไม่พบลิงค์การ์ด');
                return;
            }
            // ไปที่ลิงค์การ์ด — เมื่อเปิดจากแอป LINE จะโหลด share.html และแสดง shareTargetPicker (เลือกรายการแชร์ใน LINE)
            window.location.href = url;
        }

        async function deleteCard(cardId) {
            if (!confirm('คุณแน่ใจหรือไม่ว่าต้องการลบการ์ดนี้?')) {
                return;
            }

            try {
                const response = await fetch(`/api/cards/${cardId}`, {
                    method: 'DELETE',
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });

                const data = await response.json();

                if (data.success) {
                    alert('ลบการ์ดสำเร็จ');
                    loadCards(); // Reload cards
                } else {
                    alert('เกิดข้อผิดพลาด: ' + data.message);
                }
            } catch (error) {
                console.error('Error:', error);
                alert('เกิดข้อผิดพลาดในการลบการ์ด');
            }
        }

        function showError(message) {
            const container = document.getElementById('cardsContainer');
            container.innerHTML = `
                <div class="card">
                    <div class="alert alert-error show">${message}</div>
                </div>
            `;
        }

        // Load cards และ profile (ชื่อตามที่ลงทะเบียน)
        loadUserProfile();
        loadCards();
        } // ปิด else block
    </script>
</body>
</html>
